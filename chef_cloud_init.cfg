#cloud-config
# vim:syntax=yaml
write_files:
  - path: /var/lib/cloud/scripts/per-once/bootstrap-chef.sh
    owner: root:root
    permissions: '0754'
    content: |
      #!/bin/bash

      touch /FIRSTBOOT
      echo '{"run_list": ["recipe[enova-chef-client]"]}' > /etc/chef/firstboot.json
      /usr/bin/chef-client -j /etc/chef/firstboot.json --environment ${chef_env} -l info -L /var/log/chef/client.log && rm /FIRSTBOOT
      # Add the cookbooks
      /opt/chef/bin/knife node run_list add ${fqdn} 'role-global-base,${role_cookbooks}' -c /etc/chef/client.rb
      /opt/chef/bin/knife tag create ${fqdn} service_group:${service_group} ${additional_tags} -c /etc/chef/client.rb
      # Then trigger a check run
      pkill -USR1 chef-client
no_ssh_fingerprints: true
apt_get_command:
  - "apt-get"
  - "--option=Dpkg::Options::=--force-confold"
  - "--option=Dpkg::Options::=--force-confdef"
  - "--assume-yes"
apt_get_upgrade_subcommand: "upgrade"
preserve_sources_list: true
apt:
  sources:
    chef.list:
      key: |
        ${indent(8, chef_apt_key)}
packages:
  - [chef, "${chef_client_version}-1"]
  - cron
runcmd:
  - rm -rf /etc/ssh/*key*
  - /usr/sbin/dpkg-reconfigure openssh-server
package_update: true
package_upgrade: true
package_reboot_if_required: true
chef:
  exec: false
  install_type: "packages"
  force_install: false
  validation_cert: !!binary |
    ${validation_cert}
  environment: ${chef_env}
output: {all: '| tee -a /var/log/cloud-init-output.log'}
