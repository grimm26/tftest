#cloud-config
# vim:syntax=yaml
fqdn: ${ansible_fqdn} 
prefer_fqdn_over_hostname: true
create_hostname_file: true
manage_etc_hosts: true
users:
  - name: ansible
    homedir: /home/ansible
    shell: /bin/bash
    sudo: 'ALL=(ALL:ALL) NOPASSWD:ALL'
    ssh_authorized_keys:
    - "${ansible_publickey}"
    lock_passwd: true
apt:
  preserve_sources_list: true
  sources:
    ansible:
      source: ppa:ansible/ansible
packages:
  - cron
  - python3
  - python3-pip
  - python3-jmespath
  - libffi-dev
  - libssl-dev
  - ansible-core
  - git
  - acl
write_files:
- path: /etc/apt/preferences.d/ansible-core.pref
  owner: root:root
  permissions: '0644'
  content: |
    Package: ansible-core
    Pin: version ${ansible_version}*
    Pin-Priority: 1001
- path: /var/lib/cloud/scripts/per-once/2-ansible-global-base.sh
  owner: root:root
  permissions: '0754'
  content: |
    #!/bin/bash
    REQUIREMENTS_FILE="/home/ansible/global-base-requirements.yml"
    TEMP_FILE="/tmp/global-base-requirements.yml.tmp"
    # Download to temporary file
    wget -O "$TEMP_FILE" "$REQUIREMENTS_URL"
    # Check if local file exists and compare with downloaded file
    if [ ! -f "$REQUIREMENTS_FILE" ] || ! diff -q "$REQUIREMENTS_FILE" "$TEMP_FILE" > /dev/null 2>&1; then
        echo "File differs or doesn't exist. Updating $REQUIREMENTS_FILE"
        mv "$TEMP_FILE" "$REQUIREMENTS_FILE"
        ansible-galaxy install -r "$REQUIREMENTS_FILE" --force
    else
        echo "File is up to date. No update needed."
        ansible-galaxy install -r "$REQUIREMENTS_FILE" 
        rm "$TEMP_FILE"
    fi
no_ssh_fingerprints: true
runcmd:
  - rm -rf /etc/ssh/*key*
  - /usr/sbin/dpkg-reconfigure openssh-server -fnoninteractive
package_update: true
package_upgrade: true
package_reboot_if_required: true
output: {all: '| tee -a /var/log/cloud-init-output.log'}
